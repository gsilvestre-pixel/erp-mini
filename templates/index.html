<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Trabajadores</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h1 { color: #2c3e50; }
        form { margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, select, button { padding: 8px; margin-top: 5px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h1>Gestión de Trabajadores</h1>

    <!-- Formulario para agregar trabajadores -->
    <form action="/agregar" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="puesto">Puesto:</label>
        <input type="text" id="puesto" name="puesto" required>
        
        <label for="proyecto">Proyecto:</label>
        <select id="proyecto" name="proyecto" required>
          <option value="" disabled selected>Selecciona un proyecto…</option>
          {% for p in PROYECTOS %}
            <option value="{{ p }}">{{ p }}</option>
          {% endfor %}
        </select>
                
        <button type="submit">Agregar Trabajador</button>
    </form>

    <form action="{{ url_for('exportar') }}" method="get" style="margin-top: 10px;">
    <button type="submit">📤 Exportar a Excel</button>
</form>

    <button onclick="showPredictions()" style="margin-top: 10px; padding: 8px;">🔮 Predecir Asignaciones</button>
    
    <div id="predictions" style="display: none; margin-top: 20px; padding: 15px; background: #f0f8ff; border: 1px solid #4a90e2; border-radius: 5px;">
        <h3>Predicciones de Asignación de Trabajadores</h3>
        <div id="predictions-content"></div>
    </div>

    <script>
    function showPredictions() {
        fetch('/predict')
            .then(response => response.json())
            .then(data => {
                let html = '<h4>Balance de Proyectos</h4><table style="width: 100%; margin-bottom: 20px;"><tr><th>Proyecto</th><th>Trabajadores</th><th>Diferencia vs Promedio</th><th>Estado</th></tr>';
                
                data.balance_proyectos.forEach(p => {
                    let color = p.estado === 'sobrecargado' ? '#ffcccc' : (p.estado === 'balanceado' ? '#ccffcc' : '#ffffcc');
                    html += `<tr style="background: ${color}"><td>${p.proyecto}</td><td>${p.trabajadores_actuales}</td><td>${p.diferencia > 0 ? '+' : ''}${p.diferencia}</td><td>${p.estado}</td></tr>`;
                });
                html += '</table>';
                
                if (data.sugerencias_asignacion.length > 0) {
                    html += '<h4>Sugerencias de Asignación</h4><ul>';
                    data.sugerencias_asignacion.forEach(s => {
                        html += `<li><strong>${s.trabajador}</strong> (${s.puesto}): ${s.accion} a <strong>${s.proyecto_sugerido}</strong><br><em>Razón: ${s.razon}</em></li>`;
                    });
                    html += '</ul>';
                }
                
                if (data.necesidades_por_puesto.length > 0) {
                    html += '<h4>Distribución de Puestos por Proyecto</h4><table style="width: 100%;"><tr><th>Proyecto</th><th>Puestos</th><th>Total</th></tr>';
                    data.necesidades_por_puesto.forEach(n => {
                        let puestos = Object.entries(n.puestos).map(([k, v]) => `${k}: ${v}`).join(', ');
                        html += `<tr><td>${n.proyecto}</td><td>${puestos}</td><td>${n.total}</td></tr>`;
                    });
                    html += '</table>';
                }
                
                document.getElementById('predictions-content').innerHTML = html;
                document.getElementById('predictions').style.display = 'block';
            })
            .catch(error => {
                document.getElementById('predictions-content').innerHTML = '<p style="color: red;">Error al cargar predicciones</p>';
                document.getElementById('predictions').style.display = 'block';
            });
    }
    </script>

    <!-- Tabla de trabajadores -->
    <h2>Lista de trabajadores</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puesto</th>
            <th>Proyecto</th>
        </tr>
        {% for t in trabajadores %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>{{ t[2] }}</td>
            <td>{{ t[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
