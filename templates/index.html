<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Trabajadores</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h1 { color: #2c3e50; }
        form { margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, select, button { padding: 8px; margin-top: 5px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h1>Gestión de Trabajadores</h1>

    <!-- Formulario para agregar trabajadores -->
    <form action="/agregar" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="puesto">Puesto:</label>
        <input type="text" id="puesto" name="puesto" required>
        
        <label for="proyecto">Proyecto:</label>
        <select id="proyecto" name="proyecto" required>
          <option value="" disabled selected>Selecciona un proyecto…</option>
          {% for p in PROYECTOS %}
            <option value="{{ p }}">{{ p }}</option>
          {% endfor %}
        </select>
                
        <button type="submit">Agregar Trabajador</button>
    </form>

    <form action="{{ url_for('exportar') }}" method="get" style="margin-top: 10px;">
    <button type="submit">📤 Exportar a Excel</button>
</form>

    <a href="/diseno" style="display: inline-block; margin-top: 10px; padding: 8px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 5px;">🎨 Ir a Diseño Artístico</a>

    <!-- Tabla de trabajadores -->
    <h2>Lista de trabajadores</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puesto</th>
            <th>Proyecto</th>
        </tr>
        {% for t in trabajadores %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>{{ t[2] }}</td>
            <td>{{ t[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
